# Example: generate a changelog fragment on every pull request.
# Add this job to your existing test/CI workflow.
name: Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  GenerateChangelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate changelog fragment
        uses: ten-thousand-hammers/changelog-generate@v1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          config: cliff.toml

      - name: Make sure the fragment is readable
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: none
          version: "Unreleased"
          path: ./changelog/${{ github.event.pull_request.number }}-CHANGES.md
