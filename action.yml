name: Generate Changelog Fragment
description: >-
  Generate a per-PR changelog fragment from commits using git-cliff, stamp it
  with the PR title, and commit it to the PR branch. Idempotent: if the fragment
  already exists it is left untouched, unless refresh is on and nobody has
  edited it.

inputs:
  pr-number:
    description: Pull request number; used to name the fragment file.
    required: true
  pr-title:
    description: Pull request title; injected as an HTML comment so the merge step can group by PR.
    required: false
    default: ""
  config:
    description: Path to the git-cliff config file (project-local).
    required: false
    default: cliff.toml
  fragments-dir:
    description: Directory to write the fragment into.
    required: false
    default: changelog
  git-cliff-version:
    description: Version of the prebuilt git-cliff binary to install.
    required: false
    default: "2.12.0"
  base-ref:
    description: >-
      Branch the pull request targets. The fragment covers only the commits
      between where the PR branched from it and the PR head, so commits merged
      by earlier PRs but not yet released are left out. Empty (the default)
      reads the PR's base from the API, then falls back to github.base_ref,
      then to every commit since the last tag (git-cliff --unreleased).
    required: false
    default: ""
  base-repository:
    description: >-
      owner/repo that base-ref lives in. For a fork PR the checkout's origin is
      the fork, so the base branch is fetched from here instead.
    required: false
    default: ${{ github.repository }}
  github-token:
    description: >-
      Token used to read the pull request's base branch from the API when
      base-ref is empty. Needs read access to pull requests.
    required: false
    default: ${{ github.token }}
  commit:
    description: Whether to commit and push the generated fragment.
    required: false
    default: "true"
  commit-message:
    description: Commit message used when committing the fragment.
    required: false
    default: Generating changelog fragment
  refresh:
    description: >-
      Regenerate an existing fragment on each run, so commits pushed after it
      was written are included, as long as the last commit to touch it has
      commit-message (nobody has edited it by hand). Needs the fragment's
      history, e.g. a checkout with fetch-depth 0.
    required: false
    default: "false"

outputs:
  fragment-path:
    description: Path to the fragment file for this PR.
    value: ${{ steps.paths.outputs.fragment-path }}
  created:
    description: "'true' if a fragment was generated (new or refreshed), 'false' if an existing one was kept."
    value: ${{ steps.paths.outputs.generate == 'true' }}

runs:
  using: composite
  steps:
    - name: Resolve fragment path
      id: paths
      shell: bash
      env:
        FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REFRESH: ${{ inputs.refresh }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        mkdir -p "$FRAGMENTS_DIR"
        FRAGMENT="$FRAGMENTS_DIR/$PR_NUMBER-CHANGES.md"
        echo "fragment-path=$FRAGMENT" >> "$GITHUB_OUTPUT"
        if [ ! -f "$FRAGMENT" ]; then
          echo "generate=true" >> "$GITHUB_OUTPUT"
        elif [ "$REFRESH" = "true" ] && [ "$(git log -1 --format=%s -- "$FRAGMENT")" = "$COMMIT_MESSAGE" ]; then
          echo "Refreshing $FRAGMENT: nobody has edited it since it was generated."
          rm "$FRAGMENT"
          echo "generate=true" >> "$GITHUB_OUTPUT"
        else
          echo "generate=false" >> "$GITHUB_OUTPUT"
        fi

    # A stacked PR's CI runs as if it targets the default branch, so
    # github.base_ref names that branch even when the PR targets the branch
    # below it in the stack. The API has the branch the PR really targets.
    - name: Resolve base branch
      id: base
      if: steps.paths.outputs.generate == 'true'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        EVENT_BASE_REF: ${{ github.base_ref }}
        BASE_REPOSITORY: ${{ inputs.base-repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        ref="$BASE_REF"
        if [ -z "$ref" ] && [ -n "$GH_TOKEN" ]; then
          # GITHUB_API_URL points at the server running the workflow, so this
          # also works on GitHub Enterprise Server, where gh defaults to github.com.
          ref="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$BASE_REPOSITORY/pulls/$PR_NUMBER" 2>/dev/null | jq -r '.base.ref // empty' || true)"
          [ -n "$ref" ] || echo "::warning::Could not read the base branch of $BASE_REPOSITORY#$PR_NUMBER from the API; using github.base_ref."
        fi
        [ -n "$ref" ] || ref="$EVENT_BASE_REF"
        echo "Base branch: ${ref:-(none)}"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Install git-cliff
      if: steps.paths.outputs.generate == 'true'
      uses: ten-thousand-hammers/setup-git-cliff@v1
      with:
        version: ${{ inputs.git-cliff-version }}

    - name: Generate changelog fragment
      if: steps.paths.outputs.generate == 'true'
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        OUTPUT: ${{ steps.paths.outputs.fragment-path }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        BASE_REPOSITORY: ${{ inputs.base-repository }}
      run: |
        set -euo pipefail
        if [ -z "$BASE_REF" ]; then
          echo "::warning::No base-ref (not a pull_request event?); the fragment covers every commit since the last tag, which can include other unreleased PRs."
          git-cliff --config "$CONFIG" --unreleased -o "$OUTPUT"
          exit 0
        fi
        # --unreleased would also pick up commits that earlier PRs merged into
        # the base branch but that no release tag covers yet.
        # Fetch from the target repository, not origin: for a fork PR origin is
        # the fork, whose own branch of that name is not the PR's base.
        BASE_TRACKING_REF="refs/changelog-generate/base"
        if git fetch --no-tags --quiet "$GITHUB_SERVER_URL/$BASE_REPOSITORY.git" "+refs/heads/$BASE_REF:$BASE_TRACKING_REF" &&
          BASE_SHA="$(git merge-base "$BASE_TRACKING_REF" HEAD)"; then
          git-cliff --config "$CONFIG" "$BASE_SHA..HEAD" -o "$OUTPUT"
        else
          echo "::warning::Could not find where HEAD branched from $BASE_REPOSITORY@$BASE_REF (shallow checkout or no access?); the fragment covers every commit since the last tag instead."
          git-cliff --config "$CONFIG" --unreleased -o "$OUTPUT"
        fi

    - name: Add PR title to changelog fragment
      if: steps.paths.outputs.generate == 'true' && inputs.pr-title != ''
      shell: bash
      env:
        FRAGMENT: ${{ steps.paths.outputs.fragment-path }}
        PR_TITLE: ${{ inputs.pr-title }}
      run: |
        TMP_FILE="$(mktemp)"
        awk -v title="$PR_TITLE" '{print} /^## \[Unreleased\]/{print "<!-- title: " title " -->"}' "$FRAGMENT" > "$TMP_FILE" && mv "$TMP_FILE" "$FRAGMENT"

    - name: Commit and push changelog fragment
      if: steps.paths.outputs.generate == 'true' && inputs.commit == 'true'
      uses: EndBug/add-and-commit@v9
      with:
        add: ${{ steps.paths.outputs.fragment-path }}
        message: ${{ inputs.commit-message }}
